<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e8304f"/>
      <stop offset="0.55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffc233"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5fd6"/>
      <stop offset="1" stop-color="#2fb8c9"/>
    </linearGradient>
    <linearGradient id="knife" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#9a9ea8"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#tile)"/>
  <!-- Drawn on a 256 square, then brought in so every part stays on the tile. -->
  <g transform="translate(128 128) scale(0.84) translate(-128 -128)">
    <!-- The cool smear underneath: its shadow, its body, the ridges a knife leaves, the light on its edge. -->
    <path d="M30 206 C70 170 132 186 214 150 C226 145 234 158 226 168 C166 206 104 214 44 236 C30 241 22 216 30 206 Z" fill="#000" opacity="0.35" transform="translate(0 8)"/>
    <path d="M30 206 C70 170 132 186 214 150 C226 145 234 158 226 168 C166 206 104 214 44 236 C30 241 22 216 30 206 Z" fill="url(#cool)"/>
    <path d="M44 214 C90 192 150 196 218 162" fill="none" stroke="#0b2f6e" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <path d="M52 226 C100 210 156 204 214 176" fill="none" stroke="#0b2f6e" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 204 C74 176 134 190 212 156" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
    <!-- The warm smear on top. -->
    <path d="M24 132 C70 88 140 116 206 70 C222 60 236 76 226 90 C168 140 104 132 50 170 C30 184 10 150 24 132 Z" fill="#000" opacity="0.4" transform="translate(0 10)"/>
    <path d="M24 132 C70 88 140 116 206 70 C222 60 236 76 226 90 C168 140 104 132 50 170 C30 184 10 150 24 132 Z" fill="url(#warm)"/>
    <path d="M38 144 C84 112 146 132 214 86" fill="none" stroke="#7a1020" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
    <path d="M46 160 C94 132 152 140 220 96" fill="none" stroke="#7a1020" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 130 C74 96 140 120 206 76" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
    <!-- The palette knife that laid it, lifting off at the end of the stroke: a slender blade, its shank and handle. -->
    <path d="M194 100 C204 80 222 58 236 47 C242 43 249 49 244 56 C232 71 214 91 202 106 Z" fill="#000" opacity="0.35" transform="translate(3 6)"/>
    <path d="M194 100 C204 80 222 58 236 47 C242 43 249 49 244 56 C232 71 214 91 202 106 Z" fill="url(#knife)"/>
    <path d="M200 98 C210 80 226 61 238 51" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
    <path d="M242 50 L249 42" stroke="#c9ccd3" stroke-width="4" stroke-linecap="round"/>
    <path d="M249 42 L258 33" stroke="#7a4a2a" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
